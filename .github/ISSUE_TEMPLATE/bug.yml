name: Bug
description: "Something doesn't work as it should."
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What goes wrong, and the evidence: the steps that cause it, the output or the error message."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the change should do. Leave it empty when the problem makes that obvious.
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements that must be true before the issue closes, one per line.
      value: "- "
    validations:
      required: true
