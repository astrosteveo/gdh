name: Documentation
description: "Documentation that is missing, wrong or unclear."
labels: [documentation]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What is missing, wrong or unclear, and where it is."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the change should do. Leave it empty when the problem makes that obvious.
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements that must be true before the issue closes, one per line.
      value: "- "
    validations:
      required: true
