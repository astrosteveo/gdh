name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  band:
    name: Band tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run the band tests
        run: claude plugin test .

  suite:
    name: pytest
    # GitHub's hosted runner has no GPU, so Godot renders with Mesa's software Vulkan (lavapipe) on Xvfb, and the GPU
    # display's tests skip. Run the suite on a machine with a GPU before a release.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for the diff in "Find what changed"
      - name: Install Xvfb, software Vulkan, ffmpeg and xmessage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 ffmpeg x11-utils
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      # Godot's standard and .NET builds, and the standard build's Linux export templates (the templates archive holds
      # every platform's, about 1 GB, so only the Linux ones are kept).
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          mkdir -p ~/godot/bin && cd ~/godot
          curl -fsSLO "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          curl -fsSLO "$base/Godot_v$GODOT_VERSION-stable_mono_linux_x86_64.zip"
          curl -fsSLO "$base/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          unzip -q "Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q "Godot_v$GODOT_VERSION-stable_mono_linux_x86_64.zip"
          templates=~/.local/share/godot/export_templates/$GODOT_VERSION.stable
          mkdir -p "$templates"
          unzip -q -j "Godot_v$GODOT_VERSION-stable_export_templates.tpz" 'templates/linux_*.x86_64' \
            'templates/version.txt' -d "$templates"
          rm ./*.zip ./*.tpz
          mv "Godot_v$GODOT_VERSION-stable_linux.x86_64" bin/godot
          # The .NET build finds GodotSharp beside its own file, so it stays in its folder.
          ln -s ~/godot/Godot_v$GODOT_VERSION-stable_mono_linux_x86_64/Godot_v$GODOT_VERSION-stable_mono_linux.x86_64 \
            bin/godot-mono
      - name: Put Godot on PATH
        run: echo "$HOME/godot/bin" >> "$GITHUB_PATH"
      # Without godot or Xvfb, conftest.py skips every test and pytest passes, so fail here instead.
      - name: Check the tools the suite needs
        run: |
          for tool in godot godot-mono dotnet Xvfb ffmpeg xmessage uv; do
            command -v "$tool" || { echo "::error::$tool is not on the runner's PATH"; exit 1; }
          done
          godot --version
          godot-mono --version
      - name: Install gdh and pytest
        run: uv sync --locked
      # A change to Markdown files only can still break the docs check (tests/test_guide.py), but needs no game. When the
      # diff can't be had (a new branch, a force push), everything runs.
      - name: Find what changed
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && changed=$(git diff --name-only "$BASE" HEAD) \
              && ! grep -qvE '\.md$' <<<"$changed"; then
            echo "tests=tests/test_guide.py" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the suite
        env:
          GDH_TEST_DISPLAYS: xvfb
          TESTS: ${{ steps.changes.outputs.tests }}
        run: uv run pytest -ra --durations=30 ${TESTS:+"$TESTS"}
